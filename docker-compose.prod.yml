services:
  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - backend_net

  backend:
    build: ./backend
    env_file:
      - .env
    ports:
      - "${APP_PORT}:5000"
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 5000
      --workers 4
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - backend_net

  worker:
    build: ./backend
    env_file:
      - .env
    command: >
      celery -A app.worker.celery_app worker
      --loglevel=info
      --concurrency=4
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - backend_net

  flower:
    image: mher/flower
    env_file:
      - .env
    restart: unless-stopped
    command: >
      celery --broker=${CELERY_BROKER_URL} flower --port=5555
    ports:
      - "${FLOWER_PORT}:5555"
    depends_on:
      - worker
    networks:
      - backend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${FRONT_PORT}:3000"
    restart: unless-stopped
    networks:
      - backend_net

networks:
  backend_net:
