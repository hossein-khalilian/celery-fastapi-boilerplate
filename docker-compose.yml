services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      sh -c '
      if [ "$PRODUCTION" = "false" ]; then
        uvicorn app.main:app --host 0.0.0.0 --port ${APP_PORT} --reload;
      else
        uvicorn app.main:app --host 0.0.0.0 --port ${APP_PORT};
      fi'
    networks:
      - shared_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./backend:/app
    command: >
      sh -c '
      if [ "$PRODUCTION" = "false" ]; then
        watchmedo auto-restart --directory=./ --pattern="*.py" --recursive -- \
          celery -A app.worker.celery_app worker --loglevel=info --concurrency=1 --pool=solo;
      else
        celery -A app.worker.celery_app worker --loglevel=info --concurrency=1;
      fi'
    networks:
      - shared_net
    depends_on:
      - backend

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    command: >
      celery -A app.worker.celery_app flower
             --port=5555
    ports:
      - "5555:5555"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - shared_net
    depends_on:
      - worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend

networks:
  shared_net:
    external: true
